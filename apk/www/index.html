<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SICAO</title>
  <style>
    html,body{margin:0;height:100%;background:#1B2533;color:white;font-family:Arial,sans-serif}
    #estado{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  </style>
</head>
<body>
  <div id="estado">Actualizando SICAO-V2…</div>
  <script>
  (async function () {
    const MAESTRO = 'https://raw.githubusercontent.com/machacamamanilizandro31-boop/SICAO-V2/main/index.html';
    const CLAVE = 'sicao_v2_maestro_cache';
    try {
      const r = await fetch(MAESTRO + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      let html = await r.text();
      if (html.length < 1000000 || !html.includes('Sistema de Almac')) throw new Error('Maestro no valido');
      html = html.replace(/<head([^>]*)>/i, '<head$1><script src="sicao-puente.js"><\\/script>');
      try { localStorage.setItem(CLAVE, html); } catch (_) {}
      document.open(); document.write(html); document.close();
    } catch (e) {
      let html = null;
      try { html = localStorage.getItem(CLAVE); } catch (_) {}
      if (html) {
        document.open(); document.write(html); document.close();
      } else {
        document.getElementById('estado').innerHTML =
          'No se pudo conectar con SICAO-V2.<br><br>Verifique su conexión a Internet y vuelva a abrir la aplicación.';
      }
    }
  })();
  </script>
</body>
</html>
