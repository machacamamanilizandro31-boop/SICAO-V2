name: Crear APK y EXE
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4
      - name: Traer la version actual de SICAO (GitHub Pages)
        run: |
          curl -fsSL "https://machacamamanilizandro31-boop.github.io/SICAO/" -o www/index.html
          test "$(wc -c < www/index.html)" -gt 1000000
          grep -q "Sistema de Almac" www/index.html
      - name: Activar descargas de reportes en la app
        run: |
          python3 - <<'PY'
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          i = s.lower().find('<head')
          assert 0 <= i < 5000, 'No se encontro <head>'
          j = s.find('>', i) + 1
          s = s[:j] + '<script src="sicao-puente.js"></script>' + s[j:]
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -q 'sicao-puente.js' www/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Poner el icono de la casa SICAO
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1B2533' --iconBackgroundColorDark '#1B2533'
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: apk/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SICAO-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk

  exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - name: Traer la version actual de SICAO (GitHub Pages)
        shell: bash
        run: |
          curl -fsSL "https://machacamamanilizandro31-boop.github.io/SICAO/" -o app/index.html
          test "$(wc -c < app/index.html)" -gt 1000000
          grep -q "Sistema de Almac" app/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: SICAO-exe
          path: pc/dist/*.exe
