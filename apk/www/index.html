<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SICAO</title></head>
<body style="margin:0;background:#1B2533;color:white;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh">
<div id="estado">Actualizando SICAO...</div>
<script>
(function(){
  var MAESTRO='https://raw.githubusercontent.com/machacamamanilizandro31-boop/SICAO-V2/main/index.html';
  function abrir(html){
    if(!html || html.length<1000000 || !/Sistema de Almac/i.test(html)) throw new Error('index no valido');
    try{ localStorage.setItem('sicao_index_cache',html); }catch(e){}
    if(!/sicao-puente\.js/i.test(html)) html=html.replace(/<\/body>/i,'<script src="sicao-puente.js"><\/script><\/body>');
    document.open(); document.write(html); document.close();
  }
  fetch(MAESTRO+'?t='+Date.now(),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(abrir)
    .catch(function(){
      try{var c=localStorage.getItem('sicao_index_cache');if(c)return abrir(c);}catch(e){}
      location.replace('fallback.html');
    });
})();
</script>
</body></html>
