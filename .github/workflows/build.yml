name: Crear APK y EXE
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4
      - name: Verificar index maestro de SICAO-V2
        run: |
          curl -fsSL "https://raw.githubusercontent.com/machacamamanilizandro31-boop/SICAO-V2/main/index.html" -o /tmp/sicao-v2-index.html
          test "$(wc -c < /tmp/sicao-v2-index.html)" -gt 1000000
          grep -q "Sistema de Almac" /tmp/sicao-v2-index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Poner el icono de la casa SICAO
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1B2533' --iconBackgroundColorDark '#1B2533'
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: apk/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SICAO-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk

  exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - name: Verificar index maestro de SICAO-V2
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/machacamamanilizandro31-boop/SICAO-V2/main/index.html" -o sicao-v2-index.html
          test "$(wc -c < sicao-v2-index.html)" -gt 1000000
          grep -q "Sistema de Almac" sicao-v2-index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: SICAO-exe
          path: pc/dist/*.exe
